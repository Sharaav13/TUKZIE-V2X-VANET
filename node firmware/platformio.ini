; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Serial on UART0 (the CH343 USB-UART port), not the native USB
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	mikalhart/TinyGPSPlus@^1.1.0
	pololu/LSM6@^2.0.1
	adafruit/Adafruit NeoPixel@^1.15.5
; LoRa (sandeepmistry/arduino-LoRa) is a patched local copy in lib/LoRa, see the note at the top of lib/LoRa/src/LoRa.h
