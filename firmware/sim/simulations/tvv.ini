# TVV node firmware on the lora-v2v scenario: the firmware's MAC (TvvMac) and broadcast routing (TvvRouting).
#
# Add this line at the end of omnetpp.ini:
#     include tvv.ini
# then run:
#     tvv-run lora-v2v --config TvvFirmware [--cmdenv]
#
# Everything not set here (SUMO, channel, carrier-sense threshold, display) comes from [General] in omnetpp.ini.
# Values in brackets are the firmware's system.h constants.

[Config TvvFirmware]
description = "TVV firmware: 15 s beacons, 0-6000 ms back-off after each RxDone, LoRa preamble carrier sense, 25 B packets"
network = TvvV2V
*.manager.moduleType = "loraCar=lorav2v.TvvCar *=lorav2v.PlainCar"

# ---------------------------------------------------------------- LoRa PHY (system.h LORA_*)
*.node[*].LoRaNic.mac.centerFrequency = 433.2125MHz # LORA_FREQ
*.node[*].LoRaNic.mac.bandwidth = 125kHz            # LORA_BW
*.node[*].LoRaNic.mac.spreadingFactor = 12          # LORA_SF
*.node[*].LoRaNic.mac.codingRate = 1                # LORA_CR 5 = 4/5
*.node[*].LoRaNic.mac.txPower = 10dBm               # LORA_TXPOWER
*.node[*].LoRaNic.radio.transmitter.preambleSymbols = 8     # arduino-LoRa default preamble

# ---------------------------------------------------------------- MAC (TvvMac)
*.node[*].LoRaNic.mac.headerLength = 1B             # stands for the dest byte: 1 + 24 = 25 B on air
*.node[*].LoRaNic.mac.beaconInterval = 15000ms      # BEACON_INTVL
*.node[*].LoRaNic.mac.backoffMin = 0ms              # BACKOFF_MIN_MS
*.node[*].LoRaNic.mac.backoffMax = 6000ms           # BACKOFF_MAX_MS
*.node[*].LoRaNic.mac.pollInterval = 1ms            # networkLoop() pass
*.node[*].LoRaNic.mac.carrierSense = "preamble"     # receiving(): RegModemStat

# ---------------------------------------------------------------- Broadcast routing (TvvRouting)
*.node[*].routing.nodeId = -1                       # vehicle index + 1
*.node[*].routing.destId = 0                        # broadcast
*.node[*].routing.message = 0
*.node[*].routing.channelRssi = -120dBm             # LoRa.rssi() sent in each beacon (srcRssi)
*.node[*].routing.packetLength = 24B
*.node[*].routing.maxPeers = 3                      # MAX_PEERS
*.node[*].routing.peerTimeout = 10s                 # PEER_TIMEOUT
*.node[*].routing.peerCheckInterval = 1s            # PEER_CHECK_INTVL

# Same firmware, but carrier sense also counts any energy above energyDetection (-120 dBm in [General]).
# Not what the node does: for comparison with preamble-only sensing.
[Config TvvFirmwareEnergySense]
extends = TvvFirmware
description = "TVV firmware with energy-detect carrier sense (comparison)"
*.node[*].LoRaNic.mac.carrierSense = "energy"

# Same firmware with a cluster big enough for every vehicle (the node keeps MAX_PEERS = 3)
[Config TvvFirmwareBigCluster]
extends = TvvFirmware
description = "TVV firmware with an unlimited cluster (comparison)"
*.node[*].routing.maxPeers = 255
