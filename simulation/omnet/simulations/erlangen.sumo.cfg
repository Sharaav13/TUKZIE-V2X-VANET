<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="erlangen.net.xml"/>
        <route-files value="erlangen.rou.xml,erlangen.lora.rou.xml"/>
        <additional-files value="erlangen.poly.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="1100"/>  <!-- a little past sim-time-limit (1000 s) -->
        <step-length value="0.1"/>
    </time>

    <processing>
        <!-- keep long, dense runs flowing: cars stop waiting on a vehicle that blocks
             a junction after 20 s, and minor collisions are logged, not teleported -->
        <ignore-junction-blocker value="20"/>
        <collision.action value="warn"/>
    </processing>
    <routing>
        <!-- ordinary cars re-plan their route every 60 s around congestion
             (LoRa cars opt out via their vType, so their long routes stay intact) -->
        <device.rerouting.probability value="1"/>
        <device.rerouting.period value="60"/>
    </routing>
    <report>
        <xml-validation value="never"/>
        <xml-validation.net value="never"/>
        <no-step-log value="true"/>
    </report>

    <gui_only>
        <gui-settings-file value="erlangen.view.xml"/>
        <start value="true"/>
    </gui_only>

</configuration>
