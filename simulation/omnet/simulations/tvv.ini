# TVV node firmware on the lora-v2v scenario: the firmware's MAC (TvvMac) and routing (TvvRouting: beacons, cluster, forwarding).
#
# Add this line at the end of omnetpp.ini:
#     include tvv.ini
# then run:
#     tvv-run lora-v2v --config TvvFirmware [--cmdenv]
#
# Everything not set here (SUMO, channel, carrier-sense threshold, display) comes from [General] in omnetpp.ini.
# Values in brackets are the firmware's system.h constants.

[Config TvvFirmware]
description = "TVV firmware: 15 s beacons, 0-6000 ms back-off after each RxDone, LoRa preamble carrier sense, 25 B packets"
network = TvvV2V
*.manager.moduleType = "loraCar=lorav2v.TvvCar *=lorav2v.PlainCar"

# ---------------------------------------------------------------- LoRa PHY (system.h LORA_*)
*.node[*].LoRaNic.mac.centerFrequency = 433.2125MHz # LORA_FREQ
*.node[*].LoRaNic.mac.bandwidth = 125kHz            # LORA_BW
*.node[*].LoRaNic.mac.spreadingFactor = 12          # LORA_SF
*.node[*].LoRaNic.mac.codingRate = 1                # LORA_CR 5 = 4/5
*.node[*].LoRaNic.mac.txPower = 10dBm               # LORA_TXPOWER
*.node[*].LoRaNic.radio.transmitter.preambleSymbols = 8     # arduino-LoRa default preamble

# ---------------------------------------------------------------- MAC (TvvMac)
*.node[*].LoRaNic.mac.headerLength = 1B             # stands for the dest byte: 1 + 24 = 25 B on air
*.node[*].LoRaNic.mac.beaconInterval = 15000ms      # BEACON_INTVL
*.node[*].LoRaNic.mac.backoffMin = 0ms              # BACKOFF_MIN_MS
*.node[*].LoRaNic.mac.backoffMax = 6000ms           # BACKOFF_MAX_MS
*.node[*].LoRaNic.mac.pollInterval = 1ms            # v2vLoop() pass
*.node[*].LoRaNic.mac.carrierSense = "preamble"     # receiving(): RegModemStat

# ---------------------------------------------------------------- Routing (TvvRouting)
*.node[*].routing.nodeId = -1                       # vehicle index + 1
*.node[*].routing.destId = 0                        # broadcast
*.node[*].routing.message = 0
*.node[*].routing.packetLength = 24B
*.node[*].routing.maxPeers = 3                      # MAX_PEERS
*.node[*].routing.peerTimeout = 30s                 # PEER_TIMEOUT
*.node[*].routing.peerCheckInterval = 1s            # PEER_CHECK_INTVL
*.node[*].routing.ttlInit = 2                       # TTL_INIT
*.node[*].routing.fwdQueueSize = 2                  # FWD_QUEUE_SIZE
*.node[*].routing.dupHistory = 48                   # DUP_HISTORY
*.node[*].routing.dupWindow = 90s                   # DUP_WINDOW_MS
*.node[*].routing.rxProcessingDelay = 25.5ms        # added to beaconDelay: measured latency - time on air (Howard Centre, PPS)

# ---------------------------------------------------------------- Channel, calibrated (UCT rugby field)
# Fitted to the Bob -> Alice packets of tests/uct rugby field (nodes stationary, distance from GPS; see
# simulation/SMO1_results.txt). Censored fit of Pr = noise floor (-117.3 dBm) + SNR, 420 packets (188 received):
#   Pr(d) = -73.4 dBm - 27.7 log10(d / 1 m) + N(0, 5.8 dB), decoded above -137.1 dBm (= FLoRa's SF12/125 kHz sensitivity)
# The model's antennas are isotropic with no cable loss, so the 2 x 2 dBi antennas and 2 x 0.14 dB cables are folded
# into systemLoss: 10 dBm - Pr(1 m) - 25.18 dB (free space at 1 m, 433.2 MHz) = 58.3 dB. Every Tvv config extends
# this one; [General] keeps its uncalibrated channel (alpha 3.5, sigma 6 dB, free space at 1 m).
*.LoRaMedium.pathLoss.alpha = 2.77                  # was 3.5
*.LoRaMedium.pathLoss.sigma = 5.8                   # dB, was 6
*.LoRaMedium.pathLoss.systemLoss = 58.3dB           # was 0 dB

# Same firmware, but carrier sense also counts any energy above energyDetection (-120 dBm in [General]).
# Not what the node does: for comparison with preamble-only sensing.
[Config TvvFirmwareEnergySense]
extends = TvvFirmware
description = "TVV firmware with energy-detect carrier sense (comparison)"
*.node[*].LoRaNic.mac.carrierSense = "energy"

# Same firmware with a cluster big enough for every vehicle (the node keeps MAX_PEERS = 3)
[Config TvvFirmwareBigCluster]
extends = TvvFirmware
description = "TVV firmware with an unlimited cluster (comparison)"
*.node[*].routing.maxPeers = 255

# Forwarding: broadcasts are never forwarded, so here even vehicles address the next vehicle (vehicle 0 -> ID 2,
# vehicle 2 -> ID 4, ...) and odd vehicles broadcast. Every other vehicle that hears an addressed beacon forwards it
# once (ttl 2 -> 1).
# Compare beaconsReceivedForwarded, numForwarded and numDuplicates.
[Config TvvFirmwareForwarding]
extends = TvvFirmware
description = "TVV firmware with addressed beacons (even vehicles to the next one), so other vehicles forward them"
*.node[*].routing.destId = (parentIndex() % 2 == 0) ? parentIndex() + 2 : 0

# ==================================================================================================================
# Stationary nodes (network TvvStatic, no SUMO): channel validation and the report's simulation tests SM/O1, SM/O2.
# Run directly (no SUMO):  cd ~/TVV/lora-v2v/simulations && ./run -u Cmdenv -c <config>   (opp_runall -j16 for all runs)
# ==================================================================================================================
[Config TvvStatic]
extends = TvvFirmware
description = "TVV firmware on stationary nodes (base for the configs below)"
network = TvvStatic
**.constraintAreaMaxX = 10000m
**.vector-recording = false
**.node[*].mobility.typename = "StationaryMobility"
**.node[*].mobility.initFromDisplayString = false
**.node[*].mobility.initialZ = 0m

# Channel validation: two nodes D apart, as Alice and Bob on the rugby field. PDR = heardDirect / beaconsSent
# of the other node (tools: simulation/ results scripts). 1 h per distance, 5 seeds.
[Config TvvValidation]
extends = TvvStatic
description = "Two stationary nodes D apart, calibrated channel"
sim-time-limit = 3600s
repeat = 5
*.numNodes = 2
*.node[*].mobility.initialX = 100m + parentIndex() * ${D=10,25,50,75,100,125,150,175,200,225,250,275,300,325,350,400,500,700}m
*.node[*].mobility.initialY = 1550m

# The same with the channel before calibration ([General]: alpha 3.5, sigma 6 dB, free space at 1 m)
[Config TvvValidationUncalibrated]
extends = TvvStatic
description = "Two stationary nodes D apart, uncalibrated channel"
sim-time-limit = 3600s
repeat = 5
*.LoRaMedium.pathLoss.alpha = 3.5
*.LoRaMedium.pathLoss.sigma = 6
*.LoRaMedium.pathLoss.systemLoss = 0dB
*.numNodes = 2
*.node[*].mobility.initialX = 100m + parentIndex() * ${D=100,500,1000,2000,3000,4000,6000,9000}m
*.node[*].mobility.initialY = 1550m

# A cluster: N nodes in a disc of radius 25 m (largest separation 50 m, calibrated PDR ~99.5 %), so every node hears
# every other. Deterministic sunflower layout: node i at r = R sqrt((i + 0.5) / N), angle i x 137.5 deg.
# Traffic: 90 % broadcast beacons, 10 % addressed to a random other node (the report's assumption).
# 1 h, the first 300 s discarded (warmup-period), 10 seeds.
[Config TvvCluster]
extends = TvvStatic
description = "Stationary cluster in a 25 m disc, 10 % addressed beacons (base for SMO1, SMO2)"
sim-time-limit = 3600s
warmup-period = 300s
repeat = 10
*.node[*].routing.addressedFraction = 0.1

# SM/O1: node density sweep (peer limit), firmware back-off 0-6000 ms
[Config SMO1]
extends = TvvCluster
description = "SM/O1 node density sweep: N = 2, 5, 10, 20, 40"
*.numNodes = ${N=2,5,10,20,40}
*.node[*].mobility.initialX = 1350m + 25m * sqrt((parentIndex() + 0.5) / ${N}) * cos(parentIndex() * 2.399963)
*.node[*].mobility.initialY = 1550m + 25m * sqrt((parentIndex() + 0.5) / ${N}) * sin(parentIndex() * 2.399963)

# SM/O1 with an unlimited cluster: how many peers each node could hold (for the 3-peer limit)
[Config SMO1BigCluster]
extends = SMO1
description = "SM/O1 with an unlimited cluster (comparison)"
*.node[*].routing.maxPeers = 255

# SM/O2: back-off sweep, 10 nodes
[Config SMO2]
extends = TvvCluster
description = "SM/O2 back-off sweep: 10 nodes, BACKOFF_MAX_MS = 0, 1.5, 3, 6, 12 s"
*.numNodes = 10
*.node[*].LoRaNic.mac.backoffMax = ${B=0,1500,3000,6000,12000}ms
*.node[*].mobility.initialX = 1350m + 25m * sqrt((parentIndex() + 0.5) / 10) * cos(parentIndex() * 2.399963)
*.node[*].mobility.initialY = 1550m + 25m * sqrt((parentIndex() + 0.5) / 10) * sin(parentIndex() * 2.399963)

# Sensitivity: carrier sense sees a frame only after 4 preamble symbols (131 ms at SF12/125 kHz) instead of at once,
# so two nodes whose back-offs end within 131 ms of each other both transmit
[Config SMO1CsDetect]
extends = SMO1
description = "SM/O1 with a 4-symbol carrier-sense detection time (sensitivity)"
*.node[*].LoRaNic.mac.csDetectionTime = 131ms

[Config SMO2CsDetect]
extends = SMO2
description = "SM/O2 with a 4-symbol carrier-sense detection time (sensitivity)"
*.node[*].LoRaNic.mac.csDetectionTime = 131ms
