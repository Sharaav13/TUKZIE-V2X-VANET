[General]
network = LoRaV2V
sim-time-limit = 1000s
cmdenv-express-mode = true
**.vector-recording = true

# ---------------------------------------------------------------- Veins/SUMO
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("erlangen.launchd.xml")
# SUMO vehicles of type loraCar (10, yellow) get a LoRa node; all other traffic (blue)
# gets a PlainCar (position only, no radio) so it is visible in the OMNeT++ window.
*.manager.moduleType = "loraCar=lorav2v.LoRaV2VCar *=lorav2v.PlainCar"
*.manager.moduleName = "loraCar=node *=car"
*.manager.moduleDisplayString = "loraCar='i=veins/node/car,yellow,100;is=l' *='i=veins/node/car,blue,100;is=l'"
# black roads, green buildings (erlangen.buildings.xml, from tools/make_buildings.py)
*.roadsCanvasVisualizer.lineColor = "black"
*.roadsCanvasVisualizer.lineWidth = 2
*.physicalEnvironment.config = xmldoc("erlangen.buildings.xml")
# ordinary cars only carry a position; keep their parameters out of the result files
*.car[*].**.param-recording = false

# Playground (OMNeT++ coordinates of the Erlangen map incl. 25 m margin)
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 2700m
**.constraintAreaMaxY = 3100m
**.constraintAreaMaxZ = 50m

# ---------------------------------------------------------------- Channel
**.radio.radioMediumModule = "LoRaMedium"
# Log-distance path loss with free-space reference at 1 m, evaluated at the
# LoRa carrier (433.6 MHz -> 25.2 dB at 1 m), plus log-normal shadowing.
# alpha/sigma are typical urban V2V values; tune for your scenario.
*.LoRaMedium.pathLoss.typename = "LogNormalShadowing"
*.LoRaMedium.pathLoss.alpha = 3.5
*.LoRaMedium.pathLoss.sigma = 6
**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false
**.minInterferenceTime = 0s
**.maxTransmissionDuration = 4s     # LoRa frames are long (SF12/255 B is ~2.8 s)
**.energySourceModule = ""

# Carrier sense threshold. FLoRa's noise floor at SF7/125 kHz is -124 dBm,
# so the threshold must sit above it.
**.LoRaNic.radio.receiver.energyDetection = -120dBm

# ---------------------------------------------------------------- LoRa PHY + CSMA/CA MAC
*.node[*].LoRaNic.mac.centerFrequency = 433.6MHz
*.node[*].LoRaNic.mac.bandwidth = 125kHz
*.node[*].LoRaNic.mac.spreadingFactor = 7
*.node[*].LoRaNic.mac.codingRate = 1          # 4/5
*.node[*].LoRaNic.mac.txPower = 10dBm         # EU 433 MHz limit (10 mW e.r.p.)
*.node[*].LoRaNic.mac.headerLength = 8B
*.node[*].LoRaNic.mac.slotTime = 2.048ms
*.node[*].LoRaNic.mac.difsTime = 5ms
*.node[*].LoRaNic.mac.cw = 63
*.node[*].LoRaNic.queue.packetCapacity = 5

# ---------------------------------------------------------------- Beacon application
*.node[*].app.startTime = uniform(0s, 5s)
*.node[*].app.beaconInterval = 5s
*.node[*].app.payloadLength = 20B
include tvv.ini
