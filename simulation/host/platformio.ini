; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TVV simulated host (src/main.cpp), ESP32 DevKit
;   Flash:    pio run -e host -t upload
;   Monitor:  pio device monitor -e host
[platformio]
default_envs = host

[env:host]
platform = espressif32
board = esp32dev
framework = arduino
; Must match SERIAL_BAUD in main.cpp
monitor_speed = 115200
; time = timestamp each line, esp32_exception_decoder = readable crash backtraces
monitor_filters = time, esp32_exception_decoder
; ESP32 DevKit's CH340 USB-UART (the other COM ports on this PC are Bluetooth)
upload_port = COM15
monitor_port = COM15
